stages:
  - lint

default:
  tags:
    - aipcc

lint:
  stage: lint
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    IMAGE: registry.redhat.io/rhel8/nodejs-20:1-58
  rules:
    - if: '$CI_PROJECT_NAMESPACE != "redhat/rhel-ai"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - default.json
        - .gitlab-ci.yml
  before_script:
    - docker login registry.redhat.io --username ${REGISTRY_USER} --password ${REGISTRY_PASSWORD}
    - docker pull ${IMAGE}
  script:
    - >
      docker run \
        -v "./:/opt/app-root/src" \
        ${IMAGE} \
        npx --yes --package renovate -- renovate-config-validator --strict
